name: Build Apktool Runtime JARs

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build-runtime:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4
    with:
      ref: v1.0.0

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Runtime JARs
    run: |
      chmod +x ./gradlew
      ./gradlew :brut.apktool:apktool-android:collectRuntimeJars

  - name: Upload Runtime JARs
    uses: actions/upload-artifact@v4
    with:
      name: apktool-runtime-jars-v1.0.0
      path: brut.apktool/apktool-android/build/libs-bundle/*.jar
      if-no-files-found: error
      retention-days: 7
