# Project-level Gradle properties.
#
# This file is committed. Per-developer secrets (signing keys, etc.)
# belong in ~/.gradle/gradle.properties, NOT here.

# Required by the Android Gradle Plugin to consume any androidx.* dependency.
# The apktool-android and apktool-android-test modules pull in
# androidx.test:* (instrumented test runner, JUnit ext), which AGP refuses to
# resolve unless this is set.
android.useAndroidX=true

# We never depended on the legacy com.android.support.* libraries, so there
# is nothing to jetify. Leaving Jetifier off keeps configuration ~30% faster.
android.enableJetifier=false

# Gradle daemon + worker heap. AGP's CompressAssets/zipflinger workers buffer
# the entire asset in a NoCopyByteArrayOutputStream before deflating, so
# instrumented tests that stage a real APK as a fixture (modern.apk, ~120 MB)
# OOM at the default 512 MB. 4 GB is the AGP-recommended floor for any non-
# trivial Android build; bump this if you start staging larger fixtures.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
